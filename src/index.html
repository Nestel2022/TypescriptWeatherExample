<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima con Webpack</title>
</head>
<body>
            <div class="container">                
                <div class="weather-side">
                    <div class="weather-gradient"></div>
                    <div class="date-container">
                        <h2 id="date-dayname" class="date-dayname">---</h2><span id="date-day" class="date-day">--</span><span id="location-text" class="location">-</span>
                    </div>
                    <div class="weather-container"><img id="weather-icon" class="weather-icon" src="images/empty.png"></img>
                        <h1 id="weather-temp" class="weather-temp">--</h1>
                        <h3 id="weather-desc" class="weather-desc">-</h3>
                    </div>
                </div>
                <div class="info-side">
                    <div class="today-info-container">
                        <div class="today-info">
                            <div class="precipitation"> <span class="title">MAX TEMP</span><span id="text-temp-max" class="value">- ºC</span>
                                <div class="clear"></div>
                            </div>
                            <div class="precipitation"> <span class="title">MIN TEMP</span><span id="text-temp-min" class="value">- ºC</span>
                                <div class="clear"></div>
                            </div>
                            <div class="humidity"> <span class="title">HUMEDAD</span><span id="text-humidity" class="value">- %</span>
                                <div class="clear"></div>
                            </div>
                            <div class="wind"> <span class="title">VIENTO</span><span id="text-wind" class="value">- m/s</span>
                                <div class="clear"></div>
                            </div>
                        </div>
                    </div>
                    <div class="location-container">
                        <div id="spinner" class="spinner" style="display: none;">Cargando...</div>
                        <button id="button-location" class="location-button"><span>Cambiar ubicación</span></button>
                    </div>                   

                    <div class="location-container-input"><input placeholder="city..." id="weather-location-input" class="location-input"> </input></div>
                </div>
            </div>

            <div id="alert-container" class="alert-container" style="display: none;">
                <div class="alert-box">
                    <span id="alert-message" class="alert-message">Error message goes here</span>
                    <button id="alert-close-button" class="alert-close-button">X</button>
                </div>
            </div>
            


    
</body>
</html>
